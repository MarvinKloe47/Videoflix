# Independent local profile; Academy originals and adapter live in docker/academy.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-videoflix}
      POSTGRES_USER: ${DB_USER:-videoflix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment: &app_environment
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-videoflix}
      DB_USER: ${DB_USER:-videoflix}
      REDIS_HOST: redis
      CACHE_URL: redis://redis:6379/1
      MEDIA_ROOT: /app/media
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    volumes: &app_volumes
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  backend:
    build: .
    env_file: .env
    environment: *app_environment
    volumes: *app_volumes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/csrf/"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    build: .
    env_file: .env
    environment: *app_environment
    volumes: *app_volumes
    command: python manage.py rqworker default
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
